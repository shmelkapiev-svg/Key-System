name: Update latest version report

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate report
        run: python .github/scripts/find_latest_versions.py
      - name: Commit report if changed
        run: |
          if git diff --quiet -- LATEST_VERSIONS.md; then
            echo "Report is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LATEST_VERSIONS.md
          git commit -m "Update latest version report"
          git push
